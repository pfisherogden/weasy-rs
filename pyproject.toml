[project]
name = "weasy-rs"
version = "0.1.0"
description = "High-performance Rust HTML + CSS Paged Media to PDF renderer (drop-in replacement for WeasyPrint)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weasy_rs"]
include = [
    "src/weasy_rs/**/*.py",
    "src/weasy_rs/**/*.rs",
    "src/weasy_rs/**/*.toml",
    "src/weasy_rs/**/*.dylib",
    "src/weasy_rs/**/*.so",
    "src/weasy_rs/**/*.dll",
]
